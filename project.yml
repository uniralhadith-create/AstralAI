name: AstralAI
options:
  bundleIdPrefix: com.uniral
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: 0.9.16

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  AstralAI:
    type: application
    platform: iOS
    sources:
      - path: AstralAI
      - path: WidgetsShared
    dependencies:
      - package: ZIPFoundation
      - target: Widgets
        embed: true
      - target: ShareExtension
        embed: true
    info:
      path: AstralAI/Resources/Info.plist
      properties:
        CFBundleDisplayName: Astral AI
        CFBundleShortVersionString: "5.0.0"
        CFBundleVersion: "13"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSupportsLiveActivities: true
        BGTaskSchedulerPermittedIdentifiers:
          - com.uniral.astralai.refresh
          - com.uniral.astralai.processing
        CFBundleURLTypes:
          - CFBundleURLName: com.uniral.astralai
            CFBundleURLSchemes:
              - astral
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Astral Skill
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.uniral.astralai.skill
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.uniral.astralai.skill
            UTTypeDescription: Astral Skill
            UTTypeConformsTo:
              - public.json
              - public.text
            UTTypeTagSpecification:
              public.filename-extension:
                - skill
              public.mime-type:
                - application/json
        NSCalendarsFullAccessUsageDescription: "Astral AI creates calendar events when you ask the agent to schedule something."
        NSRemindersFullAccessUsageDescription: "Astral AI creates reminders when you ask the agent to set them."
        NSCalendarsUsageDescription: "Astral AI creates calendar events when you ask the agent to schedule something."
        NSRemindersUsageDescription: "Astral AI creates reminders when you ask the agent to set them."
    entitlements:
      path: AstralAI/AstralAI.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.uniral.astralai
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uniral.astralai
        MARKETING_VERSION: "5.0.0"
        CURRENT_PROJECT_VERSION: "13"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: "NO"

  Widgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: WidgetsShared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Astral Agents
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.uniral.astralai
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uniral.astralai.widgets
        MARKETING_VERSION: "5.0.0"
        CURRENT_PROJECT_VERSION: "13"
        SKIP_INSTALL: "YES"

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Astral AI
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsTextWithProperKey: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 5
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.uniral.astralai
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uniral.astralai.share
        MARKETING_VERSION: "5.0.0"
        CURRENT_PROJECT_VERSION: "13"
        SKIP_INSTALL: "YES"

  AstralAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: AstralAI
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uniral.astralai.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AstralAI.app/AstralAI"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  AstralAI:
    build:
      targets:
        AstralAI: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - AstralAITests
    archive:
      config: Release
