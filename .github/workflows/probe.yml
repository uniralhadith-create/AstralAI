name: runner-probe

on:
  workflow_dispatch:

jobs:
  probe-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: uname -a && echo "ubuntu ok"
  probe-macos-14:
    runs-on: macos-14
    timeout-minutes: 8
    steps:
      - run: sw_vers && echo "macos-14 ok"
  probe-macos-15:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - run: sw_vers && echo "macos-15 ok"
  probe-macos-latest:
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - run: sw_vers && echo "macos-latest ok"
