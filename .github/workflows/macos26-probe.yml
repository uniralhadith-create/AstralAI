name: macos26-probe

on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Probe ${{ matrix.os }}
        run: |
          echo "PROBE OK — ${{ matrix.os }} runner works"
          uname -a
          sw_vers
          ls -d /Applications/Xcode*.app | sort -V | tail -2
          date
