name: macos-probe

on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15, macos-14, macos-13]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Probe ${{ matrix.os }}
        run: |
          echo "PROBE OK — ${{ matrix.os }} runner works"
          uname -a
          sw_vers
          date
