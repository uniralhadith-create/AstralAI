name: build-ipa

on:
  push:
    branches: [main, master]
    tags: ["v*", "V*"]
  workflow_dispatch:

jobs:
  build:
    # Xcode 26+ (iOS 26 SDK) is REQUIRED for the native iOS 26/27
    # `glassEffect` Liquid Glass to be compiled into the binary (the old repo
    # that rendered real Liquid Glass built on macos-15 too). macos-14 only
    # has Xcode 16.2, which compiles the glass API out and ships the fallback.
    # Two Xcode-26-capable images race: free-tier macos-15/26 provisioning
    # intermittently hangs ~15 min and self-cancels, so whichever image boots
    # first produces the IPA (fail-fast disabled on purpose).
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-latest]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe & Stage Linux Alpha Kernel Metadata (install-alpha-minimal-20260426T153103Z.iso)
        continue-on-error: true
        run: |
          mkdir -p AstralAI/Resources/AlphaLinux
          curl -sL -r 0-65535 "https://distfiles.gentoo.org/releases/alpha/autobuilds/20260426T153103Z/install-alpha-minimal-20260426T153103Z.iso" -o AstralAI/Resources/AlphaLinux/iso_pvd_header.bin || true
          if [ ! -s AstralAI/Resources/AlphaLinux/iso_pvd_header.bin ]; then
            curl -sL -r 0-65535 "https://drive.google.com/uc?export=download&id=1foIDFkwz8ysUPTA0iBUa6h2EoQUk7nfa&confirm=t" -o AstralAI/Resources/AlphaLinux/iso_pvd_header.bin || true
          fi
          ls -lh AstralAI/Resources/AlphaLinux/ || true

      - name: Select newest Xcode
        run: |
          BEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $BEST"
          sudo xcode-select -s "$BEST"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project AstralAI.xcodeproj \
            -scheme AstralAI \
            -derivedDataPath build || true

      - name: Unit tests (non-blocking)
        continue-on-error: true
        run: |
          SIM_ID=$(xcrun simctl list devices available | grep -oE '\([0-9A-Fa-f]{8}-([0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}\)' | head -1 | tr -d '() ')
          if [ -z "$SIM_ID" ]; then
            echo "No simulator available - skipping tests"
            exit 0
          fi
          echo "Using simulator: $SIM_ID"
          set -o pipefail
          xcodebuild test \
            -project AstralAI.xcodeproj \
            -scheme AstralAI \
            -destination "id=$SIM_ID" \
            -derivedDataPath build \
            2>&1 | xcbeautify --quieter

      - name: Build unsigned IPA
        run: |
          set -o pipefail
          xcodebuild build \
            -project AstralAI.xcodeproj \
            -scheme AstralAI \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            > build-full.log 2>&1 || BUILD_FAILED=1

          echo "===== ALL COMPILE ERRORS ====="
          grep -E "error: " build-full.log | sort -u | head -100 || true
          echo "=============================="

          if [ "${BUILD_FAILED:-0}" = "1" ]; then
            echo "BUILD FAILED"
            exit 1
          fi

          APP="build/Build/Products/Release-iphoneos/AstralAI.app"
          if [ ! -d "$APP" ]; then
            echo "APP bundle not found at $APP"
            exit 1
          fi

          echo "===== NATIVE GLASS CHECK ====="
          # NOTE: BSD `strings` on macOS misses Swift metadata — grep the
          # Mach-O directly with -a (binary-as-text), identical semantics on
          # GNU and BSD grep.
          GLASS_COUNT=$(LC_ALL=C grep -a -c "glassEffect" "$APP/AstralAI" || true)
          echo "glassEffect occurrences in binary: $GLASS_COUNT"
          if [ "$GLASS_COUNT" -eq 0 ]; then
            echo "::error::Native iOS 26/27 glassEffect is NOT compiled into the binary (wrong Xcode — need Xcode 26+ with the iOS 26 SDK). Liquid Glass would not render on device."
            exit 1
          fi
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          mkdir -p "Payload/AstralAI.app/AlphaLinux"
          echo "Downloading full 265 MB Linux Alpha ISO (install-alpha-minimal-20260426T153103Z.iso) into IPA bundle..."
          curl -fL --retry 2 --max-time 240 "https://distfiles.gentoo.org/releases/alpha/autobuilds/20260426T153103Z/install-alpha-minimal-20260426T153103Z.iso" -o "Payload/AstralAI.app/AlphaLinux/install-alpha-minimal-20260426T153103Z.iso" || \
            curl -fL --retry 2 --max-time 240 "https://drive.google.com/uc?export=download&id=1foIDFkwz8ysUPTA0iBUa6h2EoQUk7nfa&confirm=t" -o "Payload/AstralAI.app/AlphaLinux/install-alpha-minimal-20260426T153103Z.iso" || true
          ls -lh "Payload/AstralAI.app/AlphaLinux/" || true
          zip -qry AstralAI-V7.6-unsigned.ipa Payload
          cp AstralAI-V7.6-unsigned.ipa AstralAI-unsigned.ipa
          ls -lh *.ipa

      - name: Build ad-hoc signed IPA (fallback if unsigned failed)
        if: failure()
        run: |
          set -o pipefail
          xcodebuild build \
            -project AstralAI.xcodeproj \
            -scheme AstralAI \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build-signed \
            CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            2>&1 | xcbeautify --quieter

          APP="build-signed/Build/Products/Release-iphoneos/AstralAI.app"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry AstralAI-V7.6-adhoc.ipa Payload
          cp AstralAI-V7.6-adhoc.ipa AstralAI-adhoc.ipa
          ls -lh *.ipa

          echo "===== NATIVE GLASS CHECK (ad-hoc path) ====="
          GLASS_COUNT=$(LC_ALL=C grep -a -c "glassEffect" "$APP/AstralAI" || true)
          echo "glassEffect occurrences in binary: $GLASS_COUNT"
          if [ "$GLASS_COUNT" -eq 0 ]; then
            echo "::error::Native iOS 26/27 glassEffect is NOT compiled into the ad-hoc binary (wrong Xcode — need Xcode 26+ with the iOS 26 SDK)."
            exit 1
          fi

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AstralAI-V7.6-ipa-${{ matrix.runner }}
          path: |
            *.ipa
          if-no-files-found: warn

      - name: Attach IPA to GitHub Release (keep existing notes)
        if: always() && startsWith(github.ref, 'refs/tags/')
        run: |
          # Skip silently when both the unsigned and ad-hoc builds failed.
          ls *.ipa >/dev/null 2>&1 || { echo "No IPA produced — skipping release upload"; exit 0; }
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v7.6"
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists — uploading IPA assets only (notes preserved)"
            gh release upload "$TAG" *.ipa --clobber
          else
            gh release create "$TAG" *.ipa \
              --title "Astral AI V7.6 ($TAG)" \
              --notes "Astral AI V7.6 — Linux Alpha (Gentoo Alpha kernel 6.18.52 + SquashFS RootFS embedded ISO), astra-os 7.6, videos in chat, Liquid Glass V5, 100% machine (local + cloud root). Install via AltStore, SideStore, Feather, ESign, or Sideloadly." \
              --latest
          fi
        env:
          GH_TOKEN: ${{ github.token }}
